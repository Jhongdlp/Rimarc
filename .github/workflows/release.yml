name: 'Release Rimarc'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NO_STRIP: 'true'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libayatana-appindicator3-dev libfuse2

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseName: 'Rimarc v__VERSION__'
          releaseBody: 'Instaladores oficiales de Rimarc para Linux (.deb, .AppImage, .tar.gz), Windows (.exe, .msi) y macOS (.dmg).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Linux .tar.gz (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          VERSION="0.1.0"
          ARCH_DIR="rimarc_arch_build"
          mkdir -p "${ARCH_DIR}/usr/bin"
          mkdir -p "${ARCH_DIR}/usr/share/applications"
          mkdir -p "${ARCH_DIR}/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "${ARCH_DIR}/usr/share/licenses/rimarc"

          # Copy compiled binary
          cp src-tauri/target/release/rimarc "${ARCH_DIR}/usr/bin/rimarc"
          chmod +x "${ARCH_DIR}/usr/bin/rimarc"

          # Create desktop entry
          cat << 'EOF' > "${ARCH_DIR}/usr/share/applications/rimarc.desktop"
          [Desktop Entry]
          Name=Rimarc
          Comment=Native desktop Dynamic Island for AI Agent session monitoring
          Exec=rimarc
          Icon=rimarc
          Terminal=false
          Type=Application
          Categories=Utility;Development;
          StartupWMClass=rimarc
          EOF

          # Copy icon and license
          cp src-tauri/icons/128x128.png "${ARCH_DIR}/usr/share/icons/hicolor/128x128/apps/rimarc.png"
          cp LICENSE "${ARCH_DIR}/usr/share/licenses/rimarc/LICENSE"

          # Create tar.gz
          tar -czf "Rimarc_${VERSION}_x86_64.tar.gz" -C "${ARCH_DIR}" usr

      - name: Upload Linux .tar.gz artifact
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          files: Rimarc_*_x86_64.tar.gz
